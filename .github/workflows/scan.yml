name: Scan Enigma2 Plugins

on:
  schedule:
    - cron: '0 4 * * *'        # Her gün 04:00 UTC
  workflow_dispatch:            # Manuel tetikleme (buton)

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan.py

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f catalog.json ]; then
            git add catalog.json
            if ! git diff --staged --quiet; then
              git commit -m "Update catalog $(date +%Y-%m-%d)"
              git push
            else
              echo "Değişiklik yok, commit atlanıyor."
            fi
          fi
